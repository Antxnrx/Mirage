name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test mirage-core
        run: npm test -w packages/core
      - name: Build mirage-core
        run: npx tsc -p packages/core
      - name: Typecheck server
        run: npx tsc -p server
