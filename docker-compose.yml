# Local or single-VM deployment. Only mirage is published; zkool stays on the private network.
services:
  zkool:
    build: ./deploy/zkool
    platform: linux/amd64
    volumes: [zkool-data:/data, zcash-params:/root/.zcash-params]
    restart: unless-stopped
  mirage:
    build: .
    environment:
      ZKOOL_URL: http://zkool:8000/graphql
      ZKOOL_ACCOUNTS: ${ZKOOL_ACCOUNTS:-1,2}
      EXIT_DELAY_SCALE: ${EXIT_DELAY_SCALE:-0.01}
      MAX_PER_REQUEST_ZEC: ${MAX_PER_REQUEST_ZEC:-0.1}
      SENDS_PER_HOUR: ${SENDS_PER_HOUR:-30}
    ports: ["${MIRAGE_PORT:-8787}:8787"]
    volumes: [mirage-data:/app/server/data]
    depends_on: [zkool]
    restart: unless-stopped
volumes: { zkool-data: {}, zcash-params: {}, mirage-data: {} }
